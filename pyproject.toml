[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-sse"
version = "0.0.1"
description = "Recursive Bayesian estimation for stochastic state-space models."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "ens realissimum" }
]
dependencies = [
  "numpy==2.4.2",
  "scipy==1.17.1",
  "scikit-learn==1.8.0"
]

[project.scripts]
bayes-sse = "bayes_sse.cli:main"
bayes-sse-simulations = "bayes_sse.simulations.cli:main"

[project.optional-dependencies]
simulations = [
  "matplotlib==3.10.8",
  "pandas==3.0.1"
]
dev = [
  "build",
  "pytest==9.0.2"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bayes_sse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
